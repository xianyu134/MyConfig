# ErdongChan-LazyConf (2026 iRingo借鉴 AI保驾护航版)
# ------------------
# 优化重点：
# 1. 极致精简去广告，绝对杜绝国内App(网银/淘宝/京东)误杀闪退。
# 2. 纯网络分流实现 AI 保驾护航：新增 Apple_AI 独立策略，深度吸纳 iRingo 拦截规则，不改定位。
# 3. 港版 iPhone/Mac 完美保留高德地图：屏蔽定位劫持，让 gs-loc 直连，保留地图及特斯拉直连。
# 4. 适配最新 macOS 特性，放开基础系统更新验证。
# ------------------

